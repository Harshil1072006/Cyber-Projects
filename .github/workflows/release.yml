name: Build Release Binaries

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install Fyne Cross
        run: go install github.com/fyne-io/fyne-cross@latest

      - name: Build Windows Executable
        run: fyne-cross windows -arch=amd64 -dir=VPNRotator
          
      - name: Upload Windows Binary
        uses: actions/upload-artifact@v4
        with:
          name: VPNRotator-Windows
          path: ./VPNRotator/fyne-cross/bin/windows-amd64/VPNRotator.exe

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install Fyne Cross
        run: go install github.com/fyne-io/fyne-cross@latest

      - name: Build Android APK
        run: fyne-cross android -appID com.harshil.vpnrotator -dir=VPNRotator

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: VPNRotator-Android
          path: ./VPNRotator/fyne-cross/bin/android/VPNRotator.apk
