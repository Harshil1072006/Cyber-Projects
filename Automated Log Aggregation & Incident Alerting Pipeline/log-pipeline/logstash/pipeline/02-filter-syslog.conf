# ─────────────────────────────────────────────────────────────────────────────
#  02-filter-syslog.conf  —  Parse syslog-style and application log formats
#
#  Handles two log formats:
#    FORMAT 1: Syslog-style
#      Jul 13 14:32:01 app-server-1 kernel: OOM killer invoked for process nginx
#
#    FORMAT 2: Python/Java app-style (structured but not JSON)
#      2026-07-13T14:32:01.123Z [ERROR] payment-service: Failed to charge card
#      for user_id=1234 — Connection timeout after 30s
# ─────────────────────────────────────────────────────────────────────────────

filter {

  # ── Route by log type ──────────────────────────────────────────────────────
  # Filebeat sets [log_format] field based on the file path it collected from.
  # We use that to decide which grok pattern to apply.

  if [fields][log_format] == "syslog" or [log][file][path] =~ /syslog/ {

    # ── FORMAT 1: Syslog ───────────────────────────────────────────────────
    grok {
      match => {
        "message" => [
          # Standard syslog with PID
          "%{SYSLOGTIMESTAMP:syslog_timestamp} %{SYSLOGHOST:syslog_hostname} %{DATA:syslog_program}(?:\[%{POSINT:syslog_pid}\])?: %{GREEDYDATA:syslog_message}",
          # Syslog without PID
          "%{SYSLOGTIMESTAMP:syslog_timestamp} %{SYSLOGHOST:syslog_hostname} %{DATA:syslog_program}: %{GREEDYDATA:syslog_message}",
          # Fallback: just capture everything
          "%{GREEDYDATA:syslog_message}"
        ]
      }
      tag_on_failure => ["_grokparsefailure_syslog"]
    }

    # Parse syslog timestamp (no year — default to current year)
    if [syslog_timestamp] {
      date {
        match => ["syslog_timestamp", "MMM  d HH:mm:ss", "MMM dd HH:mm:ss"]
        target => "@timestamp"
        timezone => "UTC"
      }
    }

    # Normalize to ECS fields
    mutate {
      rename => { "syslog_hostname" => "[host][name]"     }
      rename => { "syslog_program"  => "[process][name]"  }
      rename => { "syslog_pid"      => "[process][pid]"   }
      rename => { "syslog_message"  => "[log][original]"  }
      add_field => {
        "[log][format]"     => "syslog"
        "[service][name]"   => "%{[fields][service_name]}"
        "[event][dataset]"  => "syslog"
      }
    }

    # Infer log level from syslog content keywords
    if [log][original] =~ /(?i)(error|fail|fatal|critical|crit|emerg|alert)/ {
      mutate { add_field => { "[log][level]" => "error" } }
    } else if [log][original] =~ /(?i)(warn|warning)/ {
      mutate { add_field => { "[log][level]" => "warn" } }
    } else {
      mutate { add_field => { "[log][level]" => "info" } }
    }

  } else if [fields][log_format] == "app" {

    # ── FORMAT 2: Structured application log ──────────────────────────────
    grok {
      match => {
        "message" => [
          # ISO timestamp + bracketed level + service name + message
          "%{TIMESTAMP_ISO8601:app_timestamp} \[%{LOGLEVEL:log_level_raw}\] %{DATA:app_service}: %{GREEDYDATA:app_message}",
          # Without service name
          "%{TIMESTAMP_ISO8601:app_timestamp} \[%{LOGLEVEL:log_level_raw}\] %{GREEDYDATA:app_message}",
          # Epoch timestamp variant
          "%{NUMBER:epoch_timestamp} %{LOGLEVEL:log_level_raw} %{DATA:app_service} - %{GREEDYDATA:app_message}",
          # Fallback
          "%{GREEDYDATA:app_message}"
        ]
      }
      tag_on_failure => ["_grokparsefailure_app"]
    }

    # Parse ISO timestamp
    if [app_timestamp] {
      date {
        match => ["app_timestamp",
          "ISO8601",
          "yyyy-MM-dd'T'HH:mm:ss.SSSZ",
          "yyyy-MM-dd'T'HH:mm:ssZ",
          "yyyy-MM-dd HH:mm:ss,SSS"
        ]
        target => "@timestamp"
        timezone => "UTC"
      }
    }

    # Normalize log level to lowercase
    if [log_level_raw] {
      mutate {
        lowercase => ["log_level_raw"]
        rename    => { "log_level_raw" => "[log][level]" }
      }
    }

    # Map level variants to canonical values
    translate {
      field       => "[log][level]"
      destination => "[log][level]"
      dictionary => {
        "warning"   => "warn"
        "critical"  => "error"
        "fatal"     => "error"
        "exception" => "error"
        "severe"    => "error"
        "debug"     => "debug"
      }
      override => true
      fallback => "%{[log][level]}"
    }

    mutate {
      rename    => { "app_message" => "[log][original]" }
      add_field => {
        "[log][format]"    => "app"
        "[service][name]"  => "%{[fields][service_name]}"
        "[event][dataset]" => "application"
      }
    }
  }

  # ── Always: Promote Filebeat metadata to ECS ───────────────────────────────
  # Host info from Filebeat environment fields
  if [fields][host_name] {
    mutate { rename => { "[fields][host_name]" => "[host][name]" } }
  }
  if [fields][environment] {
    mutate { rename => { "[fields][environment]" => "[labels][environment]" } }
  }

  # Make message consistent (prefer parsed version)
  if ![message] or [message] == "" {
    if [log][original] {
      mutate { copy => { "[log][original]" => "message" } }
    }
  }

  # Clean up raw temp fields
  mutate {
    remove_field => [
      "app_timestamp", "syslog_timestamp", "epoch_timestamp",
      "[fields][log_format]", "[fields][service_name]", "[fields][host_name]",
      "[fields][environment]", "agent", "ecs"
    ]
  }
}
