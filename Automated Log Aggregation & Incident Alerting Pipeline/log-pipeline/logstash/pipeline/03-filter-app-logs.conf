# ─────────────────────────────────────────────────────────────────────────────
#  03-filter-app-logs.conf  —  Enrichment, tagging, and JSON log support
#
#  This stage runs AFTER format-specific parsing (02-filter-syslog.conf).
#  It handles:
#    1. JSON app logs (if message is valid JSON, parse it inline)
#    2. Nginx access log parsing
#    3. Cross-format incident tagging (auth-failure, 5xx-error, oom-kill, etc.)
#    4. User/request context extraction from message strings
#    5. GeoIP enrichment (optional, commented out — needs GeoIP DB)
# ─────────────────────────────────────────────────────────────────────────────

filter {

  # ── 1. JSON log support ──────────────────────────────────────────────────
  # If the raw message looks like JSON (e.g., from structlog/zerolog/winston),
  # parse it and promote fields to the top level.
  if [message] =~ /^\s*\{/ {
    json {
      source  => "message"
      target  => "json_payload"
      tag_on_failure => ["_jsonparsefailure"]
    }

    if "_jsonparsefailure" not in [tags] {
      # Promote canonical fields from JSON payload
      if [json_payload][timestamp] {
        date {
          match  => ["[json_payload][timestamp]", "ISO8601", "UNIX_MS", "UNIX"]
          target => "@timestamp"
        }
      }
      if [json_payload][level]   { mutate { copy => { "[json_payload][level]"   => "[log][level]"       } } }
      if [json_payload][service] { mutate { copy => { "[json_payload][service]" => "[service][name]"     } } }
      if [json_payload][msg]     { mutate { copy => { "[json_payload][msg]"     => "[log][original]"     } } }
      if [json_payload][message] { mutate { copy => { "[json_payload][message]" => "[log][original]"     } } }
      if [json_payload][host]    { mutate { copy => { "[json_payload][host]"    => "[host][name]"        } } }
      if [json_payload][request_id] { mutate { copy => { "[json_payload][request_id]" => "[trace][id]" } } }
      if [json_payload][user_id]    { mutate { copy => { "[json_payload][user_id]"    => "[user][id]"   } } }
      if [json_payload][status_code] {
        mutate { copy => { "[json_payload][status_code]" => "[http][response][status_code]" } }
      }
      if [json_payload][duration_ms] {
        mutate { copy => { "[json_payload][duration_ms]" => "[event][duration]" } }
      }

      mutate {
        add_field => { "[log][format]" => "json" }
        add_tag   => ["json-log"]
      }
    }
  }

  # ── 2. Nginx access log parsing ──────────────────────────────────────────
  if [fields][log_format] == "nginx" or [service][name] == "nginx" {
    grok {
      match => {
        "message" => [
          # Combined log format
          '%{IPORHOST:[source][ip]} - %{DATA:[user][name]} \[%{HTTPDATE:[nginx][access][time]}\] "%{WORD:[http][request][method]} %{DATA:[url][original]} HTTP/%{NUMBER:[http][version]}" %{NUMBER:[http][response][status_code]:int} %{NUMBER:[http][response][body][bytes]:int} "%{DATA:[http][request][referrer]}" "%{DATA:[user_agent][original]}"',
          # Simple log format
          '%{IPORHOST:[source][ip]} \[%{HTTPDATE:[nginx][access][time]}\] "%{WORD:[http][request][method]} %{DATA:[url][original]}" %{NUMBER:[http][response][status_code]:int} %{NUMBER:[http][response][body][bytes]:int}'
        ]
      }
      tag_on_failure => ["_grokparsefailure_nginx"]
    }

    if [nginx][access][time] {
      date {
        match  => ["[nginx][access][time]", "dd/MMM/yyyy:HH:mm:ss Z"]
        target => "@timestamp"
        remove_field => ["[nginx][access][time]"]
      }
    }

    if [http][response][status_code] {
      if [http][response][status_code] >= 500 {
        mutate { replace => { "[log][level]" => "error" } }
      } else if [http][response][status_code] >= 400 {
        mutate { replace => { "[log][level]" => "warn" } }
      } else {
        mutate { replace => { "[log][level]" => "info" } }
      }
    }

    mutate {
      add_field => {
        "[log][format]"    => "nginx_access"
        "[event][dataset]" => "nginx.access"
      }
    }
  }

  # ── 3. Incident tagging ──────────────────────────────────────────────────
  # Apply semantic tags based on message content.
  # These tags are used by error_rate_alerter.py and Kibana dashboards.

  # Auth failures
  if [log][original] =~ /(?i)(authentication fail|invalid password|invalid user|unauthorized|403 forbidden|access denied|permission denied|sudo: .+ FAILED|Failed password for)/ {
    mutate { add_tag => ["auth-failure"] }
  }

  # HTTP 5xx server errors
  if ([http][response][status_code] and [http][response][status_code] >= 500) or
     [log][original] =~ /(?i)(500 Internal Server Error|502 Bad Gateway|503 Service Unavailable|504 Gateway Timeout)/ {
    mutate { add_tag => ["5xx-error"] }
  }

  # OOM kill events
  if [log][original] =~ /(?i)(Out of memory|OOM killer|oom-kill|killed process|memory exhausted|Cannot allocate memory)/ {
    mutate {
      add_tag  => ["oom-kill"]
      add_field => { "[alert][severity]" => "critical" }
    }
  }

  # Disk full / disk space
  if [log][original] =~ /(?i)(no space left on device|disk full|filesystem.*full|inode.*exhausted|ENOSPC)/ {
    mutate {
      add_tag  => ["disk-full"]
      add_field => { "[alert][severity]" => "critical" }
    }
  }

  # Service crash / restart
  if [log][original] =~ /(?i)(segfault|segmentation fault|core dumped|panic|SIGSEGV|SIGKILL|process exited|exited with code [^0])/ {
    mutate { add_tag => ["service-crash"] }
  }

  # Database errors
  if [log][original] =~ /(?i)(connection refused|connection reset|too many connections|deadlock|lock timeout|query timeout|relation .* does not exist)/ {
    mutate { add_tag => ["database-error"] }
  }

  # SSL / Certificate issues
  if [log][original] =~ /(?i)(certificate.*expired|ssl.*error|tls.*handshake|certificate.*invalid|unable to verify)/ {
    mutate { add_tag => ["ssl-error"] }
  }

  # Rate limiting
  if [log][original] =~ /(?i)(rate limit|too many requests|429|throttl)/ {
    mutate { add_tag => ["rate-limited"] }
  }

  # ── 4. Extract request context from message ──────────────────────────────
  # Pull out user_id, request_id, etc. if embedded in message string

  if [log][original] =~ /user_id=/ {
    grok {
      match  => { "[log][original]" => "user_id=%{DATA:[user][id]}(?:\s|$|,)" }
      tag_on_failure => []
    }
  }

  if [log][original] =~ /request_id=/ {
    grok {
      match  => { "[log][original]" => "request_id=%{UUID:[trace][id]}(?:\s|$|,)" }
      tag_on_failure => []
    }
  }

  # ── 5. Compute event severity from log level ─────────────────────────────
  if ![alert][severity] {
    if [log][level] in ["error", "critical", "fatal"] {
      mutate { add_field => { "[alert][severity]" => "high" } }
    } else if [log][level] in ["warn", "warning"] {
      mutate { add_field => { "[alert][severity]" => "medium" } }
    } else {
      mutate { add_field => { "[alert][severity]" => "low" } }
    }
  }

  # ── 6. Set event.kind and event.type (ECS) ───────────────────────────────
  mutate {
    add_field => {
      "[event][kind]" => "event"
      "[event][type]" => "info"
    }
  }
  if [log][level] in ["error", "critical", "fatal"] {
    mutate { replace => { "[event][type]" => "error" } }
  }

  # ── 7. Add pipeline metadata ─────────────────────────────────────────────
  mutate {
    add_field => {
      "[pipeline][version]" => "1.0"
      "[pipeline][name]"    => "log-aggregation"
    }
  }

  # Remove json_payload after promoting fields (keep ES clean)
  mutate { remove_field => ["json_payload"] }
}
