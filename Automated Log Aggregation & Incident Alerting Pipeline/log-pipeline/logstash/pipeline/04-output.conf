# ─────────────────────────────────────────────────────────────────────────────
#  04-output.conf  —  Send processed events to Elasticsearch
#
#  Index naming: logs-{service.name}-{YYYY.MM.dd}
#  Falls back to logs-unknown-{date} if service name is missing.
#
#  Dead-letter queue: any events that fail ES indexing are logged locally
#  so we don't silently drop data.
# ─────────────────────────────────────────────────────────────────────────────

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]

    # Dynamic index name (make sure it is lowercase and doesn't contain invalid chars)
    index => "logs-generic-%{+YYYY.MM.dd}"

    # Use data stream + ILM via index template (created by setup.sh)
    ilm_enabled     => false   # We manage ILM via setup.sh for more control
    manage_template => false   # Template managed by setup.sh

    # ECS compatibility mode
    ecs_compatibility => v8

    # Retry settings
    retry_on_conflict => 3

    # Document ID: auto-generated by Elasticsearch

    # Compression
    http_compression => true

    # Auth disabled (security off in dev)
    # user     => "logstash_writer"
    # password => "${LOGSTASH_ES_PASSWORD}"
  }

  # Debug output: write to stdout when LOG_DEBUG=true (remove in prod)
  if "${LOG_DEBUG:false}" == "true" {
    stdout {
      codec => rubydebug {
        metadata => false
      }
    }
  }

  # Dead-letter queue: log failed events to a file for investigation
  if "_grokparsefailure" in [tags] or "_jsonparsefailure" in [tags] {
    file {
      path  => "/usr/share/logstash/data/dead-letter/%{+YYYY-MM-dd}.log"
      codec => json_lines
    }
  }
}
