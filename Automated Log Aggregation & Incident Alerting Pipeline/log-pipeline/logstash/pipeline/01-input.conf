# ─────────────────────────────────────────────────────────────────────────────
#  01-input.conf  —  Logstash input: accept from Filebeat (Beats protocol)
# ─────────────────────────────────────────────────────────────────────────────

input {
  beats {
    port  => 5044
    host  => "0.0.0.0"

    # Preserve original codec — Filebeat sends JSON-structured events
    # add_field is done in Filebeat config, not here
  }
}
